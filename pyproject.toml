[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vlogcut"
version = "0.0.1"
description = "Style-matched rough cuts for daily vlogs"
readme = "ARCHITECTURE.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "openai>=1.40",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
# heavy, imported lazily inside the functions that need them
analyze = ["scenedetect>=0.7", "numpy>=1.26"]

[tool.hatch.build.targets.wheel]
packages = ["src/vlogcut"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "ffmpeg: needs ffmpeg/ffprobe (skipped automatically when missing)",
  "scenedetect: needs the [analyze] extra (skipped automatically when missing)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
